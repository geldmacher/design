name: Impeccable upstream monitor

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: impeccable-upstream-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Check upstream and reconcile the maintenance issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          result_path="${RUNNER_TEMP}/impeccable-upstream.json"
          node scripts/check-impeccable-upstream.mjs --json > "${result_path}"
          node scripts/reconcile-impeccable-upstream-issue.mjs --result "${result_path}"
